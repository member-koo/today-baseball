name: Update KBO schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *' # 12:30 KST: 14:00 games
    - cron: '30 7 * * *' # 16:30 KST: evening games; GitHub may delay
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python update_data.py
      - name: Commit verified data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/today.json
          git diff --cached --quiet || (git commit -m 'Update verified KBO schedule' && git push)
