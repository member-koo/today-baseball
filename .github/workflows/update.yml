name: Update KBO schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *' # 12:30 KST: 14:00 games
    - cron: '30 7 * * *' # 16:30 KST: evening games; GitHub may delay
    - cron: '0 9 * * *' # 18:00 KST: latest starting pitchers
permissions:
  contents: write
  actions: write
concurrency:
  group: update-kbo-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python head_to_head.py
      - run: python player_records.py
      - run: python game_analysis.py
      - run: python update_data.py --skip-head-to-head
        continue-on-error: true
      - name: Commit verified data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/today.json data/head_to_head.json data/head_to_head_sources.json data/boxscores.json data/players.json data/daily_analysis.json
          git diff --cached --quiet || (git commit -m 'Update verified KBO schedule' && git push)
      - name: Publish updated records
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
