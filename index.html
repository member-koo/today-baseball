
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="manifest.webmanifest">
  <title>오늘의 야구 한판</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b1220;
      color: #edf2f7;
      font-family: system-ui, "Malgun Gothic", sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    h1 {
      font-size: clamp(25px, 4vw, 34px);
      margin-bottom: 5px;
    }

    h2 {
      font-size: 23px;
      margin-bottom: 18px;
    }

    h3 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .muted {
      color: #a9bad0;
    }

    .small {
      font-size: 13px;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 26px;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 1.5px;
      color: #80bfff;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .site-header p {
      margin-bottom: 0;
    }

    .favorite-control {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 155px;
    }

    .favorite-control label {
      font-size: 13px;
      color: #a9bad0;
      font-weight: 700;
    }

    select {
      background: #25364c;
      color: white;
      border: 1px solid #4b627f;
      border-radius: 11px;
      padding: 11px 14px;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
    }

    .panel {
      background: #192638;
      border: 1px solid #30425a;
      border-radius: 20px;
      padding: 26px;
      margin: 20px 0;
    }

    .panel-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 15px;
    }

    .panel-heading h2 {
      margin: 0;
    }

    .tag {
      display: inline-block;
      background: #30445f;
      color: #dbeafe;
      border-radius: 30px;
      padding: 7px 13px;
      font-size: 12px;
      line-height: 1.5;
    }

    .tag.ok {
      background: #134638;
      color: #b2f5d1;
    }

    .game-card {
      background: #213149;
      border: 1px solid #3b5270;
      border-radius: 16px;
      padding: 20px;
      margin: 15px 0;
    }

    .game-meta {
      color: #a9bad0;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .game-teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .team-name {
      font-size: clamp(20px, 4vw, 29px);
      font-weight: 800;
    }

    .versus {
      font-size: 15px;
      font-weight: 800;
      color: #87a2c4;
    }

    .game-note {
      margin-top: 15px;
      border-top: 1px solid #40516a;
      padding-top: 12px;
      font-size: 13px;
      color: #b4c3d7;
    }

    .empty-state {
      background: #213149;
      border: 1px dashed #425a77;
      border-radius: 14px;
      padding: 20px;
      color: #b4c3d7;
      font-size: 14px;
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    th {
      background: #233249;
      color: #b6c7df;
      font-size: 13px;
      font-weight: 700;
      padding: 13px 10px;
      white-space: nowrap;
    }

    td {
      border-bottom: 1px solid #35475f;
      padding: 15px 10px;
      text-align: center;
      white-space: nowrap;
    }

    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr.favorite-row {
      background: #34455e;
    }

    .favorite-row td:nth-child(2) {
      color: #ffdc81;
      font-weight: 800;
    }

    .favorite-star {
      color: #ffdc81;
      margin-right: 5px;
    }

    .win-pct {
      font-weight: 800;
      color: #a4d0ff;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tab-button {
      flex: 1;
      background: #25364c;
      color: #c2d0e3;
      border: 1px solid #3b5270;
      border-radius: 10px;
      padding: 12px 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-button.active {
      background: #3975c5;
      border-color: #5b9ef2;
      color: white;
    }

    .tab-content {
      min-height: 110px;
    }

    .analysis-description {
      color: #b4c3d7;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .notice {
      background: #233249;
      border-radius: 12px;
      padding: 15px;
      color: #a9bad0;
      font-size: 14px;
    }
    .record-controls { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
    .record-controls label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:#b4c3d7; }
    .record-controls select { min-width:150px; }
    .metric-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
    .metric-grid .game-card { margin:0; }
    [hidden] { display:none !important; }
    .result-button { border:1px solid transparent; cursor:pointer; min-width:34px; margin:2px; font-family:inherit; }
    .result-button[aria-pressed="true"] { background:#3975c5; border-color:#a4d0ff; color:white; }
    .result-button:focus-visible { outline:2px solid #a4d0ff; outline-offset:2px; }
    .game-detail { margin-top:14px; padding:12px 16px; background:#233249; border-radius:10px; }

    .footer-note {
      font-size: 13px;
      color: #8ea4bf;
      text-align: center;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      main {
        padding: 20px 12px 40px;
      }

      .site-header {
        align-items: flex-start;
      }

      .favorite-control {
        width: 150px;
      }

      .panel {
        padding: 18px 14px;
        border-radius: 16px;
      }

      h2 {
        font-size: 20px;
      }

      table {
        font-size: 13px;
      }

      th, td {
        padding: 12px 7px;
      }

      .game-card {
        padding: 16px 12px;
      }

      .tab-button {
        font-size: 13px;
      }
    }
    .model-judgment { font-size: 24px; font-weight: 800; margin: 12px 0 6px; }
    .model-judgment.favored { color: #74dfb5; }
    .model-judgment.close { color: #ffd78a; }
    .model-judgment.unfavored { color: #ffa7ad; }
    .model-probability { display: flex; height: 9px; overflow: hidden; border-radius: 8px; background: #487dab; margin: 14px 0 8px; }
    .model-probability span { background: #8cbce3; }
    .model-labels { display:flex; justify-content:space-between; gap:12px; font-size:13px; color:#a9bad0; }
    .model-details { margin-top:14px; font-size:13px; color:#a9bad0; }
    .model-details summary { cursor:pointer; }
  </style>
</head>

<body>
<main>

  <!-- 사이트 제목과 관심팀 설정 -->
  <header class="site-header">
    <div>
      <div class="eyebrow">KBO BASEBALL PREVIEW</div>
      <h1>⚾ 오늘의 야구 한판</h1>
      <p class="muted small">
        KBO 경기 일정과 관심팀 시즌 기록을 한눈에
      </p>
    </div>

    <div class="favorite-control">
      <label for="favorite">관심팀 설정</label>
      <select id="favorite">
        <option value="전체">전체</option>
        <option value="KIA">KIA</option>
        <option value="한화">한화</option>
        <option value="LG">LG</option>
        <option value="두산">두산</option>
        <option value="삼성">삼성</option>
        <option value="롯데">롯데</option>
        <option value="SSG">SSG</option>
        <option value="NC">NC</option>
        <option value="KT">KT</option>
        <option value="키움">키움</option>
      </select>
    </div>
  </header>

  <!-- 오늘의 경기 -->
  <section class="panel">
    <div class="panel-heading">
      <h2 id="games-title">오늘의 경기</h2>
      <span id="status" class="tag">데이터 확인 중</span>
    </div>

    <p id="headline" class="muted">
      경기 정보를 불러오는 중입니다.
    </p>

    <div id="matches">
      <div class="empty-state">
        오늘의 경기 데이터를 확인하고 있습니다.
      </div>
    </div>

    <div id="lineups"></div>

    <p id="updated" class="muted small"
       style="margin-top:20px;margin-bottom:0"></p>
  </section>

  <!-- 시즌 순위 -->
  <section class="panel">
    <div class="panel-heading">
      <h2 id="standings-title">KBO 시즌 순위</h2>
      <span class="tag">10개 구단</span>
    </div>

    <div id="standings" class="table-scroll">
      공식 순위 확인 중
    </div>
  </section>

  <!-- 관심팀 분석 -->
  <section class="panel">
    <div class="panel-heading">
      <h2 id="analysis-title">관심팀 분석</h2>
      <span class="tag">시즌 누적 기록</span>
    </div>

    <div class="tabs">
      <button class="tab-button active"
              data-tab="matchup"
              type="button">
        상대전적
      </button>

      <button class="tab-button"
              data-tab="batters"
              type="button">
        타자
      </button>

      <button class="tab-button"
              data-tab="pitchers"
              type="button">
        투수
      </button>
    </div>

    <div id="analysis-content" class="tab-content"></div>
  </section>

  <!-- 관전 포인트 -->
  <section class="panel" id="comparison-panel" hidden>
    <h2 id="comparison-title">오늘의 경기 비교</h2>

    <div id="insights" class="muted">
      공식 기록을 확인하고 있습니다.
    </div>
  </section>


</main>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);

  const TEAM_NAMES = [
    "KIA", "한화", "LG", "두산", "삼성",
    "롯데", "SSG", "NC", "KT", "키움"
  ];

  let data = null;
  let seasonMatchups = null;
  let playerRecords = null;
  let dailyAnalysis = null;
  let recordPeriod = "season";
  let selectedOpponent = "today";
  let standings = [];
  let activeTab = "matchup";

  // 관심팀 설정을 기억합니다.
  function loadFavorite() {
    try {
      const saved = localStorage.getItem("favoriteTeam");
      return TEAM_NAMES.includes(saved) ? saved : "전체";
    } catch (error) {
      return "전체";
    }
  }

  function saveFavorite(team) {
    try {
      localStorage.setItem("favoriteTeam", team);
    } catch (error) {
      // 저장이 차단된 브라우저에서도 화면은 작동합니다.
    }
  }

  $("favorite").value = loadFavorite();

  function currentFavorite() {
    return $("favorite").value;
  }

  function formatPct(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n.toFixed(3) : "-";
  }

  function formatNumber(value) {
    return Number.isFinite(Number(value))
      ? String(value)
      : "-";
  }

  function makeElement(tag, className, text) {
    const el = document.createElement(tag);

    if (className) {
      el.className = className;
    }

    if (text !== undefined && text !== null) {
      el.textContent = String(text);
    }

    return el;
  }

  function getKstDate() {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Seoul",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());

    const values = {};

    parts.forEach((part) => {
      values[part.type] = part.value;
    });

    return [
      values.year,
      values.month,
      values.day
    ].join("-");
  }

  // 오늘의 경기는 관심팀과 관계없이 전체 표시합니다.
  // 데이터가 3시간 지났다는 이유로 경기를 숨기지 않습니다.
  function renderGames() {
    const container = $("matches");
    container.replaceChildren();

    if (!data || !Array.isArray(data.games)) {
      container.appendChild(
        makeElement(
          "div",
          "empty-state",
          "경기 데이터를 확인할 수 없습니다."
        )
      );
      return;
    }

    const games = data.games;

    if (games.length === 0) {
      container.appendChild(
        makeElement(
          "div",
          "empty-state",
          data.schedule_message || "공식적으로 확인된 경기 일정이 없습니다."
        )
      );
      return;
    }

    games.forEach((game) => {
      const card = makeElement("article", "game-card");

      const meta = makeElement(
        "div",
        "game-meta",
        (game.time || "시간 미정") +
        " · " +
        (game.venue || "구장 미정")
      );

      const teams = makeElement("div", "game-teams");

      const away = makeElement(
        "div",
        "team-name",
        game.away || "원정팀"
      );

      const versus = makeElement("div", "versus", game.final
        ? game.away_score + " : " + game.home_score : "VS");

      const home = makeElement(
        "div",
        "team-name",
        game.home || "홈팀"
      );

      teams.append(away, versus, home);
      card.append(meta, teams);
      if (game.cancelled) card.appendChild(makeElement("div", "game-note", "취소 경기"));
      else if (game.final) card.appendChild(makeElement("div", "game-note", "경기 종료"));

      if (game.starting_pitchers) {
        const pitchers = game.starting_pitchers;

        if (typeof pitchers === "object") {
          const awayPitcher = pitchers.away;
          const homePitcher = pitchers.home;

          const pitcherName = (value) => {
            if (typeof value === "string") return value;
            if (value && typeof value === "object") {
              return value.name || "";
            }
            return "";
          };

          const a = pitcherName(awayPitcher);
          const h = pitcherName(homePitcher);

          if (a || h) {
            card.appendChild(
              makeElement(
                "div",
                "game-note",
                "선발투수 · " +
                (a || "미확인") +
                " / " +
                (h || "미확인")
              )
            );
          }
        }
      }

      const regular = ["0", "9", "6"].includes(String(game.series_id));
      if (!game.cancelled && regular && game.model_prediction) {
        appendModelView(card, game, game.model_prediction);
      } else if (!regular && game.series_id !== undefined && !game.cancelled) {
        card.appendChild(makeElement("div", "small muted", "포스트시즌은 예상 점수를 제공하지 않습니다."));
      } else if (regular && !game.cancelled && !game.final) {
        card.appendChild(makeElement("div", "small muted", "모델 분석 대기 · 선발과 경기 전 기록 확인 후 표시"));
      }


      container.appendChild(card);
    });
  }

  function renderLineups() {
    const container = $("lineups");
    container.replaceChildren();

    if (!data || !Array.isArray(data.games)) {
      return;
    }

    data.games.forEach((game) => {
      const lineups = game.lineups;

      if (!lineups || typeof lineups !== "object") {
        return;
      }

      const box = makeElement("div", "game-card");

      const label = lineups.status === "official"
        ? "공식 확인 라인업"
        : "예상 라인업 · 공식 미확정";

      box.appendChild(
        makeElement(
          "h3",
          "",
          game.away + " vs " + game.home + " · " + label
        )
      );

      ["away", "home"].forEach((side) => {
        const players = lineups[side];

        if (!Array.isArray(players)) {
          return;
        }

        const team = side === "away"
          ? game.away
          : game.home;

        const names = players.map((player, index) => {
          return (
            (index + 1) + ". " +
            (player.name || "미확인") +
            (player.position
              ? " (" + player.position + ")"
              : "")
          );
        });

        box.appendChild(
          makeElement(
            "p",
            "small muted",
            team + " · " + names.join(" / ")
          )
        );
      });

      container.appendChild(box);
    });
  }

  function renderStandings() {
    const container = $("standings");
    container.replaceChildren();

    if (standings.length !== 10) {
      container.appendChild(
        makeElement(
          "div",
          "empty-state",
          "10개 구단 공식 순위 데이터 확인이 필요합니다."
        )
      );
      return;
    }

    const favorite = currentFavorite();

    const table = document.createElement("table");

    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");

    [
      "순위", "구단", "경기",
      "승", "패", "무", "승률", "게임차", "연속", "최근 10경기"
    ].forEach((name) => {
      headRow.appendChild(makeElement("th", "", name));
    });

    thead.appendChild(headRow);

    const tbody = document.createElement("tbody");

    const sorted = [...standings].sort(
      (a, b) => Number(a.rank) - Number(b.rank)
    );
    const leader = sorted[0];

    sorted.forEach((team) => {
      const row = document.createElement("tr");

      if (team.team === favorite) {
        row.className = "favorite-row";
      }

      row.appendChild(
        makeElement("td", "", formatNumber(team.rank))
      );

      const nameCell = document.createElement("td");

      if (team.team === favorite) {
        nameCell.appendChild(
          makeElement("span", "favorite-star", "★")
        );
      }

      nameCell.appendChild(
        document.createTextNode(team.team || "-")
      );

      row.appendChild(nameCell);

      [
        team.games,
        team.wins,
        team.losses,
        team.draws
      ].forEach((value) => {
        row.appendChild(
          makeElement("td", "", formatNumber(value))
        );
      });

      row.appendChild(
        makeElement(
          "td",
          "win-pct",
          formatPct(team.win_pct)
        )
      );
      const gap = (Number(leader.wins) - Number(team.wins) + Number(team.losses) - Number(leader.losses)) / 2;
      row.appendChild(makeElement("td", "", Number.isFinite(gap) ? gap.toFixed(1) : "-"));
      let streak = "-", recent = "-";
      const opponents = seasonMatchups?.season === Number(String(data?.game_date || "").slice(0, 4))
        && seasonMatchups?.series === "regular" ? seasonMatchups.teams?.[team.team] : null;
      if (opponents) {
        const history = Object.values(opponents).flatMap(record => Array.isArray(record.flow) ? record.flow : [])
          .sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
        const count = result => history.filter(game => game.result === result).length;
        const verified = history.length === Number(team.games)
          && new Set(history.map(game => game.id)).size === history.length
          && count("승") === Number(team.wins) && count("패") === Number(team.losses) && count("무") === Number(team.draws);
        if (verified && history.length) {
          const last10 = history.slice(-10);
          recent = ["승", "패", "무"].map(result => last10.filter(game => game.result === result).length + result).join("-");
          const decisions = history.filter(game => game.result !== "무");
          if (decisions.length) {
            const last = decisions[decisions.length - 1].result;
            let length = 0;
            for (let i = decisions.length - 1; i >= 0 && decisions[i].result === last; i--) length++;
            streak = length + last;
          } else streak = history.length + "무";
        }
      }
      const streakCell = makeElement("td", "", streak);
      streakCell.title = "무승부는 연승·연패 계산에서 제외합니다.";
      row.append(streakCell, makeElement("td", "", recent));

      tbody.appendChild(row);
    });

    table.append(thead, tbody);
    container.appendChild(table);
  }

  function todayGames(team) {
    return dailyAnalysis?.game_date === getKstDate()
      ? dailyAnalysis.games.filter(g => !g.cancelled && (g.away === team || g.home === team)) : [];
  }

  function recordTable(headers, values) {
    const wrapper = makeElement("div", "table-scroll");
    const table = document.createElement("table");
    const head = document.createElement("thead"), row = document.createElement("tr");
    headers.forEach(label => row.appendChild(makeElement("th", "", label)));
    head.appendChild(row);
    const body = document.createElement("tbody");
    values.forEach(cells => {
      const tr = document.createElement("tr");
      cells.forEach(value => tr.appendChild(makeElement("td", "", value ?? "-")));
      body.appendChild(tr);
    });
    table.append(head, body); wrapper.appendChild(table); return wrapper;
  }

  function renderPlayers(container, team, kind) {
    if (!playerRecords) {
      container.appendChild(makeElement("div", "empty-state", "공식 선수 기록을 불러오는 중이거나 연결을 확인해야 합니다."));
      return;
    }
    const controls = makeElement("div", "record-controls");
    const makeSelect = (title, options, value, onChange) => {
      const label = makeElement("label", "", title);
      const select = document.createElement("select"); select.setAttribute("aria-label", title);
      options.forEach(([id,text]) => { const option=makeElement("option","",text); option.value=id; select.appendChild(option); });
      select.value=value; select.addEventListener("change", () => onChange(select.value));
      label.appendChild(select); controls.appendChild(label);
    };
    makeSelect("기록 범위", [["season","시즌 전체"],["recent5","최근 출전 5경기"],["recent10","최근 출전 10경기"],["opponent","상대팀 상대 기록"]],recordPeriod,value=>{recordPeriod=value;renderAnalysis();});
    if (recordPeriod === "opponent") {
      makeSelect("상대팀", [["today","오늘 경기 상대"],...TEAM_NAMES.filter(t=>t!==team).map(t=>[t,t])],selectedOpponent,value=>{selectedOpponent=value;renderAnalysis();});
    }
    container.appendChild(controls);
    const opponents = [...new Set(todayGames(team).map(g=>g.away===team?g.home:g.away))];
    const opponent = selectedOpponent === "today" ? opponents[0] : selectedOpponent;
    if (recordPeriod === "opponent" && (!opponent || opponent === team)) {
      container.appendChild(makeElement("div","empty-state","오늘 확인된 관심팀 경기가 없습니다. 상대팀을 직접 선택하면 시즌 맞대결 기록을 볼 수 있습니다."));
      return;
    }
    const people = (playerRecords.teams[team]?.[kind] || [])
      .filter(player => kind !== "batters" || Number(player.season?.PA) > 0);
    const season = recordPeriod === "season";
    const statsFor = p => season ? p.season : recordPeriod === "opponent" ? p.opponents?.[opponent] : p[recordPeriod];
    people.sort((a,b)=>Number(statsFor(b)?.[kind==="batters"?"AB":"outs"] || (kind==="pitchers"? Number.parseFloat(statsFor(b)?.IP):0) || 0)-Number(statsFor(a)?.[kind==="batters"?"AB":"outs"] || (kind==="pitchers"?Number.parseFloat(statsFor(a)?.IP):0) || 0));
    const fields = kind === "batters"
      ? (season ? [["AVG","타율"],["G","경기"],["PA","타석"],["AB","타수"],["H","안타"],["HR","홈런"],["RBI","타점"],["R","득점"]]
                : [["AVG","타율"],["G","출전"],["AB","타수"],["H","안타"],["RBI","타점"],["R","득점"]])
      : [["ERA","ERA"],["G","등판"],["IP","이닝"],["SO","삼진"],["W","승"],["L","패"],["SV","세이브"],["HLD","홀드"],...(season?[["WHIP","WHIP"]]:[])];
    if (recordPeriod === "opponent") container.appendChild(makeElement("p","small muted",team+" vs "+opponent));
    container.appendChild(recordTable(["선수",...fields.map(f=>f[1])],people.map(p=>{
      const stats=statsFor(p);
      return [p.name,...fields.map(([key])=>stats?.[key] ?? "-")];
    })));
    container.appendChild(makeElement("p","small muted",season
      ? "규정타석·규정이닝 미달 선수 포함"
      : "선수 출전·등판 기준 · - 미확인"));
  }

  function renderComparison() {
    const team=currentFavorite(), games=todayGames(team);
    const panel=$("comparison-panel"), content=$("insights");
    panel.hidden=team === "전체" || games.length === 0;
    content.replaceChildren();
    if (panel.hidden) return;
    games.forEach(game => {
      if (!game.comparison) return;
      const c=game.comparison;
      content.appendChild(makeElement("h3","",game.away+" vs "+game.home+" · "+game.time));
      const rows = [["시즌 경기 수", c.away.season.games,c.home.season.games]];
      for (const [key,label] of [["season","시즌"],["recent5","최근 5경기"],["recent10","최근 10경기"],["opponent","맞대결"]]) {
        rows.push([label+" 평균 득점",c.away[key].scored_per_game,c.home[key].scored_per_game]);
        rows.push([label+" 평균 실점",c.away[key].allowed_per_game,c.home[key].allowed_per_game]);
      }
      rows.push(["선발투수", game.starting_pitchers?.away?.name, game.starting_pitchers?.home?.name]);
      rows.push(["선발 시즌 ERA",c.away.starter?.season?.ERA,c.home.starter?.season?.ERA]);
      rows.push(["최근 3선발 ERA",c.away.starter?.recent3?.ERA,c.home.starter?.recent3?.ERA]);
      rows.push(["최근 5선발 ERA",c.away.starter?.recent5?.ERA,c.home.starter?.recent5?.ERA]);
      const opponentStat = (side, key) => {
        const stat = c[side].starter?.opponent;
        if (!stat) return "-";
        if (!stat.appearances) return key === "record" ? "등판 없음" : "-";
        if (key === "record") return stat.wins == null || stat.losses == null ? "-" : `${stat.wins}승 ${stat.losses}패`;
        if (key === "ERA") return stat.ERA == null ? "-" : Number(stat.ERA).toFixed(2);
        return stat.IP == null ? "-" : stat.IP + "이닝";
      };
      rows.push(["선발 상대팀 승·패",opponentStat("away","record"),opponentStat("home","record")]);
      rows.push(["선발 상대팀 투구이닝",opponentStat("away","IP"),opponentStat("home","IP")]);
      rows.push(["선발 상대팀 ERA",opponentStat("away","ERA"),opponentStat("home","ERA")]);
      content.appendChild(recordTable(["비교 항목",game.away,game.home],rows));
      content.appendChild(makeElement("p","small muted","이번 시즌 정규시즌 기록이며, 선발 상대팀 성적은 구원 등판도 포함합니다. '-'는 미확인 또는 등판·이닝 없음. 예상 점수는 검증 중인 참고값입니다."));
    });
  }

  function renderAnalysis() {
    const favorite = currentFavorite();
    const container = $("analysis-content");

    container.replaceChildren();

    $("analysis-title").textContent =
      favorite === "전체"
        ? "관심팀 분석"
        : favorite + " 팀 분석";

    if (favorite === "전체") {
      container.appendChild(
        makeElement(
          "div",
          "empty-state",
          "화면 오른쪽 위에서 관심팀을 선택하면 " +
          "해당 팀의 시즌 분석을 확인할 수 있습니다."
        )
      );
      return;
    }
    if (activeTab === "batters" || activeTab === "pitchers") {
      renderPlayers(container, favorite, activeTab);
      return;
    }

    if (activeTab === "matchup") {
      const detail = makeElement("div", "game-detail");
      detail.hidden = true;
      detail.setAttribute("role", "status");
      detail.setAttribute("aria-live", "polite");
      let selectedResult = null;

      const table = document.createElement("table");

      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");

      [
        "상대팀",
        "승-패-무",
        "타율",
        "ERA",
        "승패무 흐름 (첫 경기 → 마지막 경기)"
      ].forEach((label) => {
        headRow.appendChild(makeElement("th", "", label));
      });

      thead.appendChild(headRow);

      const tbody = document.createElement("tbody");

      TEAM_NAMES
        .filter((team) => team !== favorite)
        .forEach((team) => {
          const row = document.createElement("tr");

          row.appendChild(makeElement("td", "", team));

          const record = seasonMatchups?.season === 2026 && seasonMatchups?.series === "regular"
            ? seasonMatchups.teams?.[favorite]?.[team] : null;
          const values = record
            ? [record.wins + "-" + record.losses + "-" + record.draws,
               record.batting_average ?? "-", record.era ?? "-"]
            : ["-", "-", "-"];
          values.forEach((value) => {
            row.appendChild(makeElement("td", "", value));
          });
          const flow = makeElement("td", "");
          if (record && Array.isArray(record.flow)) {
            if (!record.flow.length) flow.textContent = "맞대결 없음";
            record.flow.forEach((game) => {
              const badge = makeElement("button", "tag result-button", game.result);
              badge.type = "button";
              badge.setAttribute("aria-pressed", "false");
              badge.setAttribute("aria-label", game.date + " " + favorite + " 대 " + team + " " + game.result + " " + game.score + " 상세 보기");
              badge.addEventListener("click", () => {
                const wasSelected = selectedResult === badge;
                if (selectedResult) selectedResult.setAttribute("aria-pressed", "false");
                selectedResult = wasSelected ? null : badge;
                detail.hidden = wasSelected;
                if (!wasSelected) {
                  badge.setAttribute("aria-pressed", "true");
                  flow.appendChild(detail);
                  const scores = String(game.score).split(":");
                  detail.textContent = game.date + " · " + favorite + " " + scores[0] + " : " + scores[1] + " " + team + " · " + game.result;
                }
              });
              flow.appendChild(badge);
            });
          } else flow.textContent = "-";
          row.appendChild(flow);

          tbody.appendChild(row);
        });

      table.append(thead, tbody);

      const wrapper = makeElement("div", "table-scroll");
      wrapper.appendChild(table);

      container.appendChild(wrapper);
      container.appendChild(detail);
      container.appendChild(makeElement("p", "small muted", "타율·ERA 미확인"));

      return;
    }

    if (activeTab === "batters") {
      container.appendChild(
        makeElement(
          "p",
          "analysis-description",
          favorite + " 타자 · 해당 연도 누적 기록"
        )
      );

      container.appendChild(
        makeElement(
          "div",
          "notice",
          "타율, 출루율, 장타율, OPS, 홈런, 타점, " +
          "안타, 타석 등의 공식 기록을 연결할 예정입니다. " +
          "규정타석 충족 여부도 구분합니다."
        )
      );

      return;
    }

    if (activeTab === "pitchers") {
      container.appendChild(
        makeElement(
          "p",
          "analysis-description",
          favorite + " 투수 · 해당 연도 누적 기록"
        )
      );

      container.appendChild(
        makeElement(
          "div",
          "notice",
          "평균자책점, WHIP, 이닝, 탈삼진, 승, " +
          "세이브, 홀드 등의 공식 기록을 연결할 예정입니다. " +
          "선발과 불펜을 구분해 규정이닝 미달 구원투수도 " +
          "확인할 수 있도록 구성합니다."
        )
      );
    }
  }

  function updateFavorite() {
    const favorite = currentFavorite();

    saveFavorite(favorite);

    // 관심팀은 순위와 분석에만 영향을 줍니다.
    renderStandings();
    renderAnalysis();
    renderComparison();
    if (data) renderGames();

    // 오늘의 경기에는 필터를 적용하지 않습니다.
  }

  function appendModelView(container, game, prediction, focusTeam = currentFavorite()) {
    const homeP = Number(prediction.home_probability);
    if (!Number.isFinite(homeP) || homeP < 0 || homeP > 1) return;
    const focus = [game.away,game.home].includes(focusTeam) ? focusTeam : (homeP >= .5 ? game.home : game.away);
    const p = focus === game.home ? homeP : 1-homeP;
    const status = p >= .6 ? "우세" : p <= .4 ? "열세" : "접전";
    const kind = p >= .6 ? "favored" : p <= .4 ? "unfavored" : "close";
    container.appendChild(makeElement("div", "model-judgment " + kind, status === "접전" ? game.away + " · " + game.home + " 접전" : focus + " " + status));
    container.appendChild(makeElement("div", "game-note", "참고 스코어 · " + game.away + " " + prediction.away_score + " : " + prediction.home_score + " " + game.home));
    const bar=makeElement("div","model-probability");
    const segment=makeElement("span");segment.style.width=((1-homeP)*100)+"%";bar.append(segment);
    bar.setAttribute("aria-hidden","true");container.append(bar);
    const labels=makeElement("div","model-labels");
    labels.append(makeElement("span","",game.away+" "+Math.round((1-homeP)*100)+"%"),makeElement("span","",game.home+" "+Math.round(homeP*100)+"%"));container.append(labels);
    container.appendChild(makeElement("p","small muted","실험 모델 · 확정 라인업 미반영"));
    const details=makeElement("details","model-details");details.append(makeElement("summary","","예측 기준 보기"));
    details.append(makeElement("p","","팀 전력·선발·불펜·득점 모델을 결합한 참고값입니다. 확률은 승패가 갈리는 경우 기준이며, 검증된 적중률을 뜻하지 않습니다. 동점 스코어도 무승부 예측을 뜻하지 않습니다. 기록 기준: "+prediction.stats_as_of));
    container.append(details);
  }

  function setupTabs() {
    const buttons = document.querySelectorAll(".tab-button");

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        activeTab = button.dataset.tab;

        buttons.forEach((item) => {
          item.classList.toggle(
            "active",
            item.dataset.tab === activeTab
          );
        });

        renderAnalysis();
      });
    });
  }

  function renderUpdated() {
    const sources = [["경기", data?.updated_at], ["상대전적", seasonMatchups?.updated_at], ["선수", playerRecords?.updated_at]];
    const dates = sources.map(([,value])=>Date.parse(value)).filter(Number.isFinite);
    if (!dates.length) { $("updated").textContent = "업데이트 미확인"; return; }
    const parts = new Intl.DateTimeFormat("en-GB", {timeZone:"Asia/Seoul",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date(Math.max(...dates)));
    const values = Object.fromEntries(parts.map(p=>[p.type,p.value]));
    $("updated").textContent = "업데이트 " + values.month + "." + values.day + " " + values.hour + ":" + values.minute;
    $("updated").title = sources.filter(([,value])=>value).map(([label,value])=>label+": "+value).join("\n");
  }

  function renderData() {
    if (dailyAnalysis && dailyAnalysis.game_date === getKstDate()) {
      const next = dailyAnalysis.schedule_kind === "next";
      const shownDate = dailyAnalysis.display_date || dailyAnalysis.game_date;
      const weekday = new Intl.DateTimeFormat("ko-KR",{weekday:"short",timeZone:"Asia/Seoul"}).format(new Date(shownDate+"T12:00:00+09:00"));
      data = {...(data || {}), games:dailyAnalysis.games, game_date:shownDate,
        schedule_reference_date:dailyAnalysis.game_date,schedule_kind:dailyAnalysis.schedule_kind,
        schedule_message:dailyAnalysis.schedule_message,
        updated_at:dailyAnalysis.updated_at, source:dailyAnalysis.source,
        title:shownDate + " (" + weekday + ") KBO 경기 일정", status:next ? "KBO 공식 다음 경기 확인" : dailyAnalysis.schedule_kind === "unavailable" ? "다음 일정 확인 필요" : "KBO 공식 당일 경기 확인"};
    }
    const kst = getKstDate();
    const isToday = (data.schedule_reference_date || data.game_date) === kst;
    const isNext = data.schedule_kind === "next" && isToday;
    $("games-title").textContent = isNext ? "다음 경기" : "오늘의 경기";
    $("comparison-title").textContent = isNext ? "다음 경기 비교" : "오늘의 경기 비교";

    const updatedTime = data.updated_at
      ? Date.parse(data.updated_at)
      : NaN;

    const age = Date.now() - updatedTime;

    const isRecent =
      Number.isFinite(age) &&
      age >= -300000 &&
      age < 10800000;

    const status = $("status");

    if (isToday && isRecent) {
      status.textContent =
        data.status || "KBO 공식 경기 일정 확인";

      status.classList.add("ok");
    } else if (isToday) {
      status.textContent =
        (isNext ? "다음 일정" : "오늘 일정") + " · 최신 갱신 여부 확인 필요";

      status.classList.remove("ok");
    } else {
      status.textContent =
        "이전 날짜 데이터 · 갱신 확인 필요";

      status.classList.remove("ok");
    }

    $("headline").textContent =
      data.title || "KBO 경기 일정";

    if (!isToday) {
      $("headline").textContent +=
        " · 현재 날짜와 다를 수 있습니다";
    }

    renderUpdated();

    const year = String(data.game_date || "").slice(0, 4);

    $("standings-title").textContent =
      (year || "KBO") + " KBO 시즌 순위";

    standings = Array.isArray(data.standings)
      ? data.standings
      : [];


    // 핵심: 데이터를 받은 뒤 경기 표시 함수를 실행합니다.
    renderGames();
    renderLineups();
    updateFavorite();
  }

  async function loadData() {
    try {
      const response = await fetch(
        "./data/today.json?ts=" + Date.now(),
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error(
          "HTTP " + response.status
        );
      }

      data = await response.json();

      renderData();

    } catch (error) {
      console.error("데이터 로딩 실패:", error);
      if (dailyAnalysis && dailyAnalysis.game_date === getKstDate()) { renderData(); return; }

      $("status").textContent = "데이터 연결 오류";

      $("headline").textContent =
        "경기 데이터를 불러오지 못했습니다.";

      $("matches").replaceChildren(
        makeElement(
          "div",
          "empty-state",
          "데이터 파일을 불러오지 못했습니다. " +
          "잠시 후 새로고침해 주세요."
        )
      );

      $("standings").replaceChildren(
        makeElement(
          "div",
          "empty-state",
          "순위 데이터를 불러오지 못했습니다."
        )
      );
    }
  }

  $("favorite").addEventListener(
    "change",
    updateFavorite
  );

  setupTabs();
  renderAnalysis();
  loadData();
  fetch("./data/head_to_head.json?ts=" + Date.now(), {cache: "no-store"})
    .then((response) => {
      if (!response.ok) throw new Error("Season results unavailable");
      return response.json();
    })
    .then((result) => {
      if (result.season !== 2026 || result.series !== "regular" || !result.teams) {
        throw new Error("Season mismatch");
      }
      seasonMatchups = result;
      renderUpdated();
      renderStandings();
      renderAnalysis();
    })
    .catch((error) => { console.warn(error); renderAnalysis(); });
  fetch("./data/players.json?ts=" + Date.now(), {cache:"no-store"})
    .then(r => { if (!r.ok) throw new Error("선수 기록 미확인"); return r.json(); })
    .then(result => {
      if (result.season !== 2026 || result.series !== "regular" || !result.teams) throw new Error("선수 시즌 불일치");
      playerRecords = result; renderUpdated(); renderAnalysis();
    }).catch(error => { console.warn(error); renderAnalysis(); });
  fetch("./data/daily_analysis.json?ts=" + Date.now(), {cache:"no-store"})
    .then(r => { if (!r.ok) throw new Error("당일 비교 기록 미확인"); return r.json(); })
    .then(result => {
      if (result.game_date !== getKstDate() || !Array.isArray(result.games)) return;
      dailyAnalysis = result; renderData();
    }).catch(error => { console.warn(error); renderComparison(); });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker
      .register("./sw.js")
      .catch(() => {});
  }

})();
</script>

</body>
</html>
